name: MCP library generator

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  generate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Generate OpenAPI spec
        shell: bash
        run: |
          pnpm dlx swagger2openapi "https://www.migalabs.io/docs/doc.json" -o openapi.json

      - name: Install root dependencies
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile

      - name: Generate MCP tool definitions
        shell: bash
        run: |
          node scripts/generate-tools.mjs openapi.json ./mcp/src/tools.ts

      - name: Build MCP server package
        working-directory: ./mcp
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build
          if [ ! -f build/index.js ]; then
            echo "ERROR: build/index.js missing after build."
            ls -R .
            exit 1
          fi

      - name: Set package version from release tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" ./mcp/package.json
          echo "Version set to ${VERSION}"

      # Staging uploads the tarball without publishing it and without a 2FA
      # prompt. Approve later with:
      #   npm stage list @migalabs/mcp
      #   npm stage approve <stage-id>
      - name: Stage MCP package on npm
        working-directory: ./mcp
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Prereleases need an explicit tag; stable versions use `latest`.
          if [[ "$VERSION" == *-* ]]; then
            TAG="beta"
          else
            TAG="latest"
          fi
          npm stage publish --access public --tag "$TAG" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack package for Release
        working-directory: ./mcp
        run: |
          # Pack and rename the archive to mcp-<version>.tgz for a cleaner release asset name
          VERSION="${GITHUB_REF_NAME#v}"
          npm pack
          PACKED=$(ls *.tgz | head -1)
          mv "$PACKED" "mcp-${VERSION}.tgz"
          echo "Packed as: mcp-${VERSION}.tgz"

      - name: Upload archive to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" ./mcp/mcp-*.tgz --clobber
